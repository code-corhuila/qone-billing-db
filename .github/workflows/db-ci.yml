name: db-ci
on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Every V has its U, no file outside the families
        run: |
          set -e
          for f in $(find migrations -path migrations/undo -prune -o -name 'V*__*.sql' -print); do
            v=$(basename "$f" | sed -E 's/^V([0-9]+)__.*/\1/')
            find migrations/undo -name "U${v}__*.sql" | grep -q . || { echo "missing U${v} for $f"; exit 1; }
          done
      - name: Seed e-mails on .test, no password hash in any migration (qone-docs#55)
        run: sh scripts/check-seed-identities.sh
      - name: Rebuild from zero, apply again, undo everything, rebuild, validate, seed twice (Annex A)
        run: sh scripts/rebuild-check.sh
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail if a secret was ever committed, whole history (gitleaks, HU-PLT-005)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --config /repo/.gitleaks.toml --redact --verbose
